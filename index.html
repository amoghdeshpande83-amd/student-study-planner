<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Study Planner</title>

    <style>

        /* ---------- GENERAL STYLING ---------- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        /* ---------- HEADER ---------- */

        header {
            background: linear-gradient(135deg, #4a148c, #1565c0);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 17px;
        }

        /* ---------- STATISTICS ---------- */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .stat-card h2 {
            color: #4a148c;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .stat-card p {
            color: #555;
            font-size: 16px;
        }

        /* ---------- ADD TASK FORM ---------- */

        .form-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .form-section h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
        }

        input,
        select {
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn {
            background: #4a148c;
            color: white;
        }

        .add-btn:hover {
            background: #6a1b9a;
        }

        /* ---------- PROGRESS BAR ---------- */

        .progress-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .progress-section h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .progress-bar-container {
            width: 100%;
            height: 25px;
            background: #e0e0e0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4a148c, #1565c0);
            transition: width 0.5s ease;
        }

        /* ---------- TASK LIST ---------- */

        .tasks-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .tasks-section h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            border-left: 5px solid #4a148c;
            background: #f8f8f8;
            margin-bottom: 12px;
            border-radius: 8px;
        }

        .task-info {
            flex: 1;
        }

        .task-info h3 {
            color: #333;
            margin-bottom: 6px;
        }

        .task-info p {
            color: #666;
            font-size: 14px;
        }

        .completed h3 {
            text-decoration: line-through;
            color: #777;
        }

        .completed {
            opacity: 0.7;
            border-left-color: green;
        }

        .task-buttons {
            display: flex;
            gap: 8px;
        }

        .complete-btn {
            background: green;
            color: white;
        }

        .delete-btn {
            background: #d32f2f;
            color: white;
        }

        .complete-btn:hover {
            background: darkgreen;
        }

        .delete-btn:hover {
            background: #b71c1c;
        }

        .no-tasks {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        /* ---------- RESPONSIVE DESIGN ---------- */

        @media (max-width: 800px) {

            .form {
                grid-template-columns: 1fr 1fr;
            }

            .add-btn {
                grid-column: span 2;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {

            body {
                padding: 10px;
            }

            header h1 {
                font-size: 27px;
            }

            .form {
                grid-template-columns: 1fr;
            }

            .add-btn {
                grid-column: span 1;
            }

            .task {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .task-buttons {
                width: 100%;
            }

            .task-buttons button {
                flex: 1;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- ---------- HEADER ---------- -->

        <header>
            <h1>📚 Student Study Planner</h1>
            <p>Plan your studies, track your tasks, and achieve your goals!</p>
        </header>


        <!-- ---------- STATISTICS ---------- -->

        <section class="stats">

            <div class="stat-card">
                <h2 id="totalTasks">0</h2>
                <p>Total Tasks</p>
            </div>

            <div class="stat-card">
                <h2 id="completedTasks">0</h2>
                <p>Completed Tasks</p>
            </div>

            <div class="stat-card">
                <h2 id="progressPercentage">0%</h2>
                <p>Progress</p>
            </div>

        </section>


        <!-- ---------- ADD TASK FORM ---------- -->

        <section class="form-section">

            <h2>➕ Add New Study Task</h2>

            <div class="form">

                <input
                    type="text"
                    id="subjectInput"
                    placeholder="Enter subject"
                >

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter study task"
                >

                <input
                    type="date"
                    id="dateInput"
                >

                <button
                    class="add-btn"
                    onclick="addTask()"
                >
                    Add Task
                </button>

            </div>

        </section>


        <!-- ---------- PROGRESS BAR ---------- -->

        <section class="progress-section">

            <h2>📊 Study Progress</h2>

            <div class="progress-bar-container">

                <div
                    class="progress-bar"
                    id="progressBar"
                >
                </div>

            </div>

        </section>


        <!-- ---------- TASK LIST ---------- -->

        <section class="tasks-section">

            <h2>📝 My Study Tasks</h2>

            <div id="taskList">

                <p class="no-tasks">
                    No study tasks added yet.
                </p>

            </div>

        </section>

    </div>


    <!-- ---------- JAVASCRIPT ---------- -->

    <script>

        // Array to store all study tasks
        let tasks = [];


        // Function to add a new task
        function addTask() {

            // Get values from input fields
            let subject = document.getElementById("subjectInput").value;
            let taskName = document.getElementById("taskInput").value;
            let date = document.getElementById("dateInput").value;


            // Check whether all fields are filled
            if (subject === "" || taskName === "" || date === "") {

                alert("Please fill in all the fields!");

                return;
            }


            // Create a new task object
            let newTask = {

                id: Date.now(),

                subject: subject,

                task: taskName,

                date: date,

                completed: false

            };


            // Add the task to the tasks array
            tasks.push(newTask);


            // Clear input fields
            document.getElementById("subjectInput").value = "";
            document.getElementById("taskInput").value = "";
            document.getElementById("dateInput").value = "";


            // Display tasks
            displayTasks();


            // Update statistics
            updateStatistics();

        }


        // Function to display all tasks
        function displayTasks() {

            let taskList = document.getElementById("taskList");


            // Clear the task list
            taskList.innerHTML = "";


            // Check if there are no tasks
            if (tasks.length === 0) {

                taskList.innerHTML = `
                    <p class="no-tasks">
                        No study tasks added yet.
                    </p>
                `;

                return;
            }


            // Display every task
            tasks.forEach(function(task) {


                // Create a task element
                let taskElement = document.createElement("div");


                // Add completed class if task is completed
                if (task.completed) {

                    taskElement.className = "task completed";

                } else {

                    taskElement.className = "task";

                }


                // Add task content
                taskElement.innerHTML = `

                    <div class="task-info">

                        <h3>${task.subject}</h3>

                        <p>
                            📖 ${task.task}
                        </p>

                        <p>
                            📅 Date: ${task.date}
                        </p>

                    </div>


                    <div class="task-buttons">

                        <button
                            class="complete-btn"
                            onclick="completeTask(${task.id})"
                        >
                            ${task.completed ? "Undo" : "Complete"}
                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteTask(${task.id})"
                        >
                            Delete
                        </button>

                    </div>

                `;


                // Add the task to the page
                taskList.appendChild(taskElement);

            });

        }


        // Function to mark a task as completed
        function completeTask(id) {

            tasks.forEach(function(task) {

                if (task.id === id) {

                    task.completed = !task.completed;

                }

            });


            // Refresh the page
            displayTasks();

            updateStatistics();

        }


        // Function to delete a task
        function deleteTask(id) {

            // Keep only tasks whose ID does not match
            tasks = tasks.filter(function(task) {

                return task.id !== id;

            });


            // Refresh the page
            displayTasks();

            updateStatistics();

        }


        // Function to update statistics
        function updateStatistics() {

            // Total number of tasks
            let total = tasks.length;


            // Count completed tasks
            let completed = tasks.filter(function(task) {

                return task.completed === true;

            }).length;


            // Calculate progress percentage
            let progress = 0;


            if (total > 0) {

                progress = Math.round((completed / total) * 100);

            }


            // Update the numbers on the page
            document.getElementById("totalTasks").innerText = total;

            document.getElementById("completedTasks").innerText = completed;

            document.getElementById("progressPercentage").innerText =
                progress + "%";


            // Update progress bar
            document.getElementById("progressBar").style.width =
                progress + "%";

        }

    </script>

</body>

</html>
